apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: simplelog
  namespace: simplelog
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - logs.andyleap.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Gate the route through the TinyOAuth ForwardAuth middleware.
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: simplelog
      backendRefs:
        - group: ""
          kind: Service
          name: simplelog-manager
          port: 8080
          weight: 1
