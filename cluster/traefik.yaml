apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-traefik:main"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: 'https://traefik.github.io/charts'
      chart: traefik
      targetRevision: 34.4.1
      helm:
        valueFiles:
          - $values/traefik/values.yaml
    - repoURL: 'https://github.com/andyleap-cluster/cluster.git'
      targetRevision: live
      ref: values
    - repoURL: 'https://github.com/andyleap-cluster/cluster.git'
      targetRevision: live
      path: traefik/extras
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
