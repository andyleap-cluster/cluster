apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-projects
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-kargo-projects:main"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/andyleap-cluster/cluster.git'
    path: kargo-projects
    targetRevision: live
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - ServerSideApply=true
  ignoreDifferences:
    # Kargo's controller defaults fields on Warehouse and Stage resources
    # (freightCreationPolicy, interval, discoveryLimit, etc.). Ignore the
    # `kargo` field manager's writes so ArgoCD doesn't churn.
    - group: kargo.akuity.io
      kind: Warehouse
      managedFieldsManagers:
        - kargo
    - group: kargo.akuity.io
      kind: Stage
      managedFieldsManagers:
        - kargo
