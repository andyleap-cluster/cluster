apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-kargo:main"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: 'ghcr.io/akuity/kargo-charts'
      chart: kargo
      targetRevision: 1.11.2
      helm:
        valueFiles:
          - $values/kargo/values.yaml
    - repoURL: 'https://github.com/andyleap-cluster/cluster.git'
      targetRevision: live
      ref: values
    - repoURL: 'https://github.com/andyleap-cluster/cluster.git'
      targetRevision: live
      path: kargo/extras
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kargo
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      managedFieldsManagers:
        - kube-controller-manager
    - group: batch
      kind: CronJob
      managedFieldsManagers:
        - kube-controller-manager
