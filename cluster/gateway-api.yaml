apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  # Retirement prep: prune:false and no finalizer let the next PR delete
  # this Application without cascade-deleting its CRDs, so traefik-crds can
  # adopt them in place.
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-gateway-api:main"
spec:
  project: default
  source:
    repoURL: 'https://github.com/andyleap-cluster/cluster.git'
    path: gateway-api
    targetRevision: live
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
    - ServerSideApply=true
