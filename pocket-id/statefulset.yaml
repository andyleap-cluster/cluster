apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pocket-id
  labels:
    app.kubernetes.io/name: pocket-id
spec:
  serviceName: pocket-id
  replicas: 1
  revisionHistoryLimit: 1
  # Default RollingUpdate strategy is fine: with replicas: 1 the
  # rolling update takes the single pod down before creating the new
  # one (sequential by ordinal), which preserves Litestream's
  # single-writer guarantee. The maxUnavailable knob was gated behind
  # a feature flag LKE doesn't expose and was redundant anyway.
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: data
          emptyDir: {}
        - name: litestream-config
          configMap:
            name: pocket-id-litestream
      initContainers:
        # Pull the latest snapshot from S3 into the emptyDir. -if-replica-exists=true
        # makes this a no-op on first boot (before any backup exists).
        - name: litestream-restore
          image: docker.io/litestream/litestream:0.5.11
          imagePullPolicy: IfNotPresent
          args:
            - restore
            - -if-replica-exists=true
            - -config=/etc/litestream/litestream.yaml
            - /app/data/pocket-id.db
          envFrom:
            - secretRef:
                name: pocket-id-bootstrap
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: litestream-config
              mountPath: /etc/litestream
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v2.6.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 1411
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pocket-id-config
            - secretRef:
                name: pocket-id-bootstrap
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        # Streams SQLite WAL changes to S3 continuously. Snapshot every minute by
        # default; defaults are fine for a small DB.
        - name: litestream
          image: docker.io/litestream/litestream:0.5.11
          imagePullPolicy: IfNotPresent
          args:
            - replicate
            - -config=/etc/litestream/litestream.yaml
          envFrom:
            - secretRef:
                name: pocket-id-bootstrap
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: litestream-config
              mountPath: /etc/litestream
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
