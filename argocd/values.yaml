# ArgoCD Helm chart values
# https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd

configs:
  params:
    server.insecure: true

  cm:
    # Server-side diff: ArgoCD asks the apiserver for a dry-run
    # apply and compares the predicted result to live state, so
    # apiserver-defaulted fields (StatefulSet's podManagementPolicy,
    # persistentVolumeClaimRetentionPolicy, etc.) stop showing up
    # as drift across every Application. Respects Kubernetes's
    # field ownership model rather than comparing raw manifests
    # byte-for-byte.
    resource.compareoptions: |
      serverSideDiff: true

    # Public URL of ArgoCD; required for OIDC redirect URLs.
    url: https://argocd.andyleap.dev

    # Disable local admin -- OIDC is the only auth path. Loss of OIDC
    # is recoverable by reverting this flag via Kargo + ArgoCD config.
    admin.enabled: "false"

    # OIDC against Pocket ID. clientID + clientSecret are referenced
    # from the kubernetes_secret managed by Terraform (argocd-oidc).
    # Pocket ID emits the `groups` claim when the OIDC client requests
    # the `groups` scope; argocd-admins / argocd-viewers membership
    # flows through to the policy below.
    oidc.config: |
      name: Pocket ID
      issuer: https://id.andyleap.dev
      clientID: $argocd-oidc:clientID
      clientSecret: $argocd-oidc:clientSecret
      # Pocket ID's client is created with pkce_enabled=true (enforces
      # PKCE on every token exchange). ArgoCD's web login flow doesn't
      # send a code_verifier by default; this flag turns on PKCE for
      # the web flow too so the verifier matches.
      enablePKCEAuthentication: true
      requestedScopes:
        - openid
        - profile
        - email
        - groups
      requestedIDTokenClaims:
        groups:
          essential: true

  rbac:
    # Default deny -- only members of mapped groups have any access.
    policy.default: ""
    policy.csv: |
      g, argocd-admins, role:admin
      g, argocd-viewers, role:readonly
