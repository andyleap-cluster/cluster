apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: main
  namespace: kargo-traefik
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: traefik
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: git@github.com:andyleap-cluster/cluster.git
            checkout:
              - branch: master
                path: ./src
              - branch: live
                create: true
                path: ./out
        # Sync this Stage's owned slice (traefik/) from master to live.
        # Clear first so files removed on master don't linger.
        # cluster/traefik.yaml is owned by the kargo-cluster Stage.
        - uses: git-clear
          # First promotion against a fresh live has no ./out/traefik — that's
          # expected; ignore the resulting "no such file or directory" error.
          continueOnError: true
          config:
            path: ./out/traefik
        - uses: copy
          config:
            inPath: ./src/traefik
            outPath: ./out/traefik
        - uses: yaml-update
          config:
            path: ./out/traefik/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom("docker.io/traefik").Tag }}
        - uses: git-commit
          config:
            path: ./out
            message: |
              kargo: bump traefik image to ${{ imageFrom("docker.io/traefik").Tag }}
        - uses: git-push
          config:
            path: ./out
            targetBranch: live
        - uses: argocd-update
          config:
            apps:
              - name: traefik
                namespace: argocd
