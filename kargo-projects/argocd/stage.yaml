apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: main
  namespace: kargo-argocd
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: argocd
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: git@github.com:andyleap-cluster/cluster.git
            checkout:
              - branch: master
                path: ./src
              - branch: live
                create: true
                path: ./out
        # Sync this Stage's owned slice (argocd/) from master to live.
        # Clear first so files removed on master don't linger.
        # cluster/argocd.yaml is owned by the kargo-cluster Stage.
        - uses: git-clear
          # First promotion against a fresh live has no ./out/argocd — that's
          # expected; ignore the resulting "no such file or directory" error.
          continueOnError: true
          config:
            path: ./out/argocd
        - uses: copy
          config:
            inPath: ./src/argocd
            outPath: ./out/argocd
        - uses: git-commit
          config:
            path: ./out
            message: |
              kargo: sync argocd/ to live
        - uses: git-push
          config:
            path: ./out
            targetBranch: live
        - uses: argocd-update
          config:
            apps:
              - name: argocd
                namespace: argocd
