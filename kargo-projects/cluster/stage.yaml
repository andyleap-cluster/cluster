apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: main
  namespace: kargo-cluster
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: cluster
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: git@github.com:andyleap-cluster/cluster.git
            checkout:
              - branch: master
                path: ./src
              - branch: live
                create: true
                path: ./out
        # This Stage owns the entire cluster/ dir on live. Clearing
        # first and then copying the whole directory means file
        # additions and removals on master both propagate cleanly —
        # per-app Stages no longer write into cluster/.
        - uses: git-clear
          continueOnError: true
          config:
            path: ./out/cluster
        - uses: copy
          config:
            inPath: ./src/cluster
            outPath: ./out/cluster
        - uses: git-commit
          config:
            path: ./out
            message: |
              kargo: mirror cluster/ to live
        - uses: git-push
          config:
            path: ./out
            targetBranch: live
        - uses: argocd-update
          config:
            apps:
              - name: cluster
                namespace: argocd
