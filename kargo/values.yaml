# Kargo Helm chart values
# https://github.com/akuity/kargo/tree/main/charts/kargo

crds:
  install: true
  keep: true

api:
  adminAccount:
    enabled: true
  # passwordHash + tokenSigningKey come from the Terraform-managed Secret.
  secret:
    name: kargo-api
  host: kargo.andyleap.dev
  service:
    type: ClusterIP
  ingress:
    enabled: false
  # TLS terminated upstream by Traefik (Gateway API HTTPRoute, letsencrypt cert).
  # Kargo API serves plain HTTP on port 80 inside the cluster.
  tls:
    enabled: false

webhooksServer:
  tls:
    selfSignedCert: true

controller:
  argocd:
    integrationEnabled: true
    namespace: argocd

managementController:
  enabled: true

garbageCollector:
  enabled: true
