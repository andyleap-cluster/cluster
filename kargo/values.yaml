# Kargo Helm chart values
# https://github.com/akuity/kargo/tree/main/charts/kargo

crds:
  install: true
  keep: true

api:
  # Local admin disabled -- OIDC is the only auth path.
  # The kargo-api Secret stays for ADMIN_ACCOUNT_TOKEN_SIGNING_KEY,
  # which the API server uses to sign session JWTs even for OIDC
  # users. Cleanup of the now-unused PASSWORD_HASH is a follow-up.
  adminAccount:
    enabled: false
  secret:
    name: kargo-api
  host: kargo.andyleap.dev
  service:
    type: ClusterIP
  ingress:
    enabled: false
  # TLS terminated upstream by Traefik (Gateway API HTTPRoute, letsencrypt cert).
  # Kargo API serves plain HTTP on port 80 inside the cluster.
  tls:
    enabled: false

  # OIDC against Pocket ID. PKCE-only (no client_secret).
  #
  # clientID is a placeholder here: Pocket ID auto-generates a UUID
  # for the OIDC client (the trozz/pocketid provider can't pin a
  # custom id today), and the real value lives in the TF-managed
  # kargo-oidc Secret which we mount via api.envFrom below.
  # api.envFrom is concatenated AFTER the chart's built-in
  # configmap/secret envFroms, so OIDC_CLIENT_ID from the Secret
  # wins the pod env merge.
  oidc:
    enabled: true
    issuerURL: https://id.andyleap.dev
    clientID: overridden-by-kargo-oidc-secret
    usernameClaim: sub
    additionalScopes:
      - groups
    admins:
      claims:
        groups:
          - kargo-admins
    # Read-only access to all Kargo resources (Stages, Promotions,
    # Warehouses, Freight, Projects). The chart renders a `kargo-viewer`
    # ServiceAccount + ClusterRole/ClusterRoleBinding and stamps these
    # claims onto the SA; Kargo's API server impersonates that SA for
    # any user whose token matches a claim here.
    viewers:
      claims:
        groups:
          - kargo-viewers

  envFrom:
    - secretRef:
        name: kargo-oidc

webhooksServer:
  tls:
    selfSignedCert: true

# Public webhook-receiver endpoint (separate hostname from the API).
# Traefik terminates TLS at the edge via the kargo-webhooks HTTPRoute;
# the pod serves plain HTTP and `terminatedUpstream: true` tells Kargo
# to still publish https:// URLs in ClusterConfig/ProjectConfig status
# so GitHub gets a real TLS URL to POST to.
externalWebhooksServer:
  host: kargo-webhooks.andyleap.dev
  tls:
    enabled: false
    terminatedUpstream: true

controller:
  argocd:
    integrationEnabled: true
    namespace: argocd
  # Make Secrets in the `kargo` namespace (created by Terraform) available
  # to every Kargo project. Otherwise each project's namespace would need
  # its own copy of the cluster-repo-creds Secret.
  globalCredentials:
    namespaces:
      - kargo
  # Serialize promotions cluster-wide. All Stages push to the same live
  # branch, so concurrent promotions race and 3-of-4 lose on non-fast-forward.
  # The default git-push retry just re-pushes the same commit so it doesn't
  # rebase on conflict. One worker = no race.
  reconcilers:
    promotions:
      maxConcurrentReconciles: 1

managementController:
  enabled: true

garbageCollector:
  enabled: true
