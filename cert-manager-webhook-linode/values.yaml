# cert-manager-webhook-linode configuration

api:
  # Group name used in ClusterIssuer/Issuer webhook config
  groupName: acme.slicen.me

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

deployment:
  # Linode API credentials secret configuration
  # This should match the secret created by Terraform
  secretName: linode-credentials
  secretKey: token
  # Disable logLevel - the webhook binary doesn't support --v flag
  logLevel: ""

image:
  repository: linode/cert-manager-webhook-linode
  # Placeholder so Kargo's yaml-update can mutate this key. Kargo writes
  # the discovered version on every promotion. The chart's template does
  # `{{ .repository }}:{{ .tag }}` with no fallback, so this must be
  # non-empty for out-of-Kargo renders.
  tag: v0.4.1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 443

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
